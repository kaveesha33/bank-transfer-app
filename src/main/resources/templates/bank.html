<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Bank Transfer System</title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body>

<header>
    <h1>Bank Transfer System</h1>
    <p>Customer and Transaction Management</p>
</header>


<main>

    <!-- Success and error messages -->

    <div class="success"
         th:if="${successMessage}"
         th:text="${successMessage}">
    </div>

    <div class="error"
         th:if="${errorMessage}"
         th:text="${errorMessage}">
    </div>


    <!-- Dashboard statistics -->

    <section class="statistics">

        <div class="stat-card">
            <h3>Total Balance</h3>

            <p>
                LKR
                <span th:text="${totalBalance}"></span>
            </p>
        </div>

        <div class="stat-card">
            <h3>Successful Transfers</h3>

            <p th:text="${successCount}"></p>
        </div>

        <div class="stat-card">
            <h3>Failed Transfers</h3>

            <p th:text="${failedCount}"></p>
        </div>

    </section>


    <!-- Transfer money form -->

    <section>

        <h2>Transfer Money</h2>

        <form th:action="@{/transfer}"
              th:object="${transferRequest}"
              method="post">

            <label>Sender Account</label>

            <select th:field="*{fromAccount}" required>

                <option value="">Select sender</option>

                <option th:each="c : ${customers}"
                        th:value="${c.accountNumber}"
                        th:text="${c.accountNumber + ' - ' + c.fullName}">
                </option>

            </select>

            <p class="error"
               th:errors="*{fromAccount}">
            </p>


            <label>Receiver Account</label>

            <select th:field="*{toAccount}" required>

                <option value="">Select receiver</option>

                <option th:each="c : ${customers}"
                        th:value="${c.accountNumber}"
                        th:text="${c.accountNumber + ' - ' + c.fullName}">
                </option>

            </select>

            <p class="error"
               th:errors="*{toAccount}">
            </p>


            <label>Amount (LKR)</label>

            <input type="number"
                   step="0.01"
                   th:field="*{amount}">

            <p class="error"
               th:errors="*{amount}">
            </p>


            <label class="checkbox-label">

                <input type="checkbox"
                       th:field="*{simulateFailure}">

                Simulate a system failure after withdrawal

            </label>


            <button type="submit">
                Transfer Money
            </button>

        </form>

    </section>


    <!-- Add customer form -->

    <section>

        <h2>Add New Customer</h2>

        <form th:action="@{/customers}"
              th:object="${customerRequest}"
              method="post">

            <label>Full Name</label>

            <input type="text"
                   th:field="*{fullName}">

            <p class="error"
               th:errors="*{fullName}">
            </p>


            <label>Account Number</label>

            <input type="text"
                   th:field="*{accountNumber}">

            <p class="error"
               th:errors="*{accountNumber}">
            </p>


            <label>Email</label>

            <input type="email"
                   th:field="*{email}">

            <p class="error"
               th:errors="*{email}">
            </p>


            <label>Initial Balance</label>

            <input type="number"
                   step="0.01"
                   th:field="*{initialBalance}">

            <p class="error"
               th:errors="*{initialBalance}">
            </p>


            <button type="submit">
                Add Customer
            </button>

        </form>

    </section>


    <!-- Customer search -->

    <section>

        <h2>Customers</h2>

        <form th:action="@{/}" method="get">

            <input type="text"
                   name="keyword"
                   placeholder="Search customers..."
                   th:value="${keyword}">

            <button type="submit">Search</button>

            <a th:href="@{/}">Clear</a>

        </form>


        <table>

            <thead>

                <tr>
                    <th>Account</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Balance</th>
                    <th>Action</th>
                </tr>

            </thead>

            <tbody>

                <tr th:each="c : ${customers}">

                    <td th:text="${c.accountNumber}"></td>

                    <td th:text="${c.fullName}"></td>

                    <td th:text="${c.email}"></td>

                    <td th:text="${c.balance}"></td>

                    <td>
                        <a th:href="@{/accounts/{id}/history(id=${c.accountNumber})}">
                            View History
                        </a>
                    </td>

                </tr>

            </tbody>

        </table>

    </section>


    <!-- Latest transactions -->

    <section>

        <h2>Latest Transactions</h2>

        <table>

            <thead>

                <tr>
                    <th>ID</th>
                    <th>From</th>
                    <th>To</th>
                    <th>Amount</th>
                    <th>Status</th>
                    <th>Date</th>
                    <th>Description</th>
                </tr>

            </thead>

            <tbody>

                <tr th:each="t : ${latestTransactions}">

                    <td th:text="${t.id}"></td>

                    <td th:text="${t.fromAccount}"></td>

                    <td th:text="${t.toAccount}"></td>

                    <td th:text="${t.amount}"></td>

                    <td th:text="${t.status}"></td>

                    <td th:text="${t.createdAt}"></td>

                    <td th:text="${t.description}"></td>

                </tr>

            </tbody>

        </table>

    </section>

</main>

</body>

</html>
